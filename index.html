    <script>
      // Polyfill/enable writable fetch on window in iframe environments
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : null;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(newFetch) {
            _fetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Continue normally
      }
    </script>
